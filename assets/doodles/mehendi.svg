<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="sangeetBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B5D1E"/>
      <stop offset="50%" stop-color="#1C0307"/>
      <stop offset="100%" stop-color="#2D060C"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#sangeetBg)"/>

  <!-- Top Marigold & Paisley Garland Decor -->
  <g fill="#FFB800" stroke="#CC8800" stroke-width="2">
    <circle cx="100" cy="80" r="22"/><circle cx="200" cy="90" r="22"/><circle cx="300" cy="95" r="22"/>
    <circle cx="400" cy="100" r="28" fill="#FF8C00"/>
    <circle cx="500" cy="95" r="22"/><circle cx="600" cy="90" r="22"/><circle cx="700" cy="80" r="22"/>
  </g>

  <!-- Header Banner -->
  <text x="400" y="160" text-anchor="middle" font-family="'Rozha One', 'Yatra One', serif" font-size="34" fill="#FFD700" font-weight="bold">
    मेहंदी राछण एवं महिला संगीत
  </text>
  <text x="400" y="200" text-anchor="middle" font-family="'Rozha One', 'Yatra One', serif" font-size="24" fill="#FFF5C0">
    Groom Naveen Luhach's Family Celebration
  </text>

  <!-- Dholak Musical Drum Illustration in Center -->
  <g transform="translate(250, 260)">
    <!-- Dholak Body -->
    <ellipse cx="150" cy="120" rx="140" ry="85" fill="#8B4513" stroke="#FFD700" stroke-width="5"/>
    <!-- Left Drum Head -->
    <ellipse cx="25" cy="120" rx="20" ry="80" fill="#F5DEB3" stroke="#5D4037" stroke-width="4"/>
    <circle cx="25" cy="120" r="20" fill="#3E2723"/>
    <!-- Right Drum Head -->
    <ellipse cx="275" cy="120" rx="20" ry="80" fill="#F5DEB3" stroke="#5D4037" stroke-width="4"/>
    <circle cx="275" cy="120" r="25" fill="#3E2723"/>
    <!-- Dholak Ropes -->
    <line x1="25" y1="50" x2="275" y2="190" stroke="#FFD700" stroke-width="3"/>
    <line x1="25" y1="190" x2="275" y2="50" stroke="#FFD700" stroke-width="3"/>
    <line x1="25" y1="120" x2="275" y2="120" stroke="#FFD700" stroke-width="2"/>
  </g>

  <!-- Henna Hands Illustration (Bottom Left & Right) -->
  <g transform="translate(100, 480)">
    <!-- Left Henna Hand -->
    <path d="M 60,180 L 70,60 L 90,40 L 110,60 L 115,180 Z" fill="#FAD7A0" stroke="#8B0000" stroke-width="3"/>
    <!-- Henna Mandala Pattern -->
    <circle cx="90" cy="120" r="25" fill="none" stroke="#8B0000" stroke-width="3" stroke-dasharray="6 3"/>
    <circle cx="90" cy="120" r="8" fill="#8B0000"/>
  </g>

  <g transform="translate(540, 480)">
    <!-- Right Henna Hand -->
    <path d="M 110,180 L 100,60 L 80,40 L 60,60 L 55,180 Z" fill="#FAD7A0" stroke="#8B0000" stroke-width="3"/>
    <!-- Henna Mandala Pattern -->
    <circle cx="80" cy="120" r="25" fill="none" stroke="#8B0000" stroke-width="3" stroke-dasharray="6 3"/>
    <circle cx="80" cy="120" r="8" fill="#8B0000"/>
  </g>

  <!-- Event Detail Banner Card at Bottom -->
  <g transform="translate(140, 680)">
    <rect width="520" height="75" rx="20" fill="#1C0307" stroke="#FFD700" stroke-width="3"/>
    <text x="260" y="34" text-anchor="middle" font-family="'Rozha One', serif" font-size="22" fill="#FFD700" font-weight="bold">
      17 नवंबर 2026  •  सायं 04:00 बजे से
    </text>
    <text x="260" y="60" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" fill="#FFF5C0">
      नंधा की ढाणी, बाढड़ा  |  ढोलक की थाप एवं हरियाणवी लोकगीत
    </text>
  </g>
</svg>
