<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradLagan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A0810"/>
      <stop offset="50%" stop-color="#6B0F1A"/>
      <stop offset="100%" stop-color="#1C0307"/>
    </linearGradient>
    <linearGradient id="scrollPaper" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0"/>
      <stop offset="50%" stop-color="#FFF9D2"/>
      <stop offset="100%" stop-color="#F5E49B"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bgGradLagan)"/>

  <!-- Golden Backdrop Mandala & Garland -->
  <circle cx="400" cy="400" r="340" fill="none" stroke="#FFD700" stroke-width="2" stroke-dasharray="10 5" opacity="0.4"/>
  <circle cx="400" cy="400" r="360" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.3"/>

  <!-- Royal Golden Scroll Container -->
  <g transform="translate(140, 70)">
    <!-- Top & Bottom Wooden Scroll Rods -->
    <rect x="-20" y="0" width="560" height="26" rx="13" fill="#B8860B" stroke="#FFD700" stroke-width="3"/>
    <circle cx="-20" cy="13" r="18" fill="#FFD700"/>
    <circle cx="540" cy="13" r="18" fill="#FFD700"/>

    <rect x="-20" y="640" width="560" height="26" rx="13" fill="#B8860B" stroke="#FFD700" stroke-width="3"/>
    <circle cx="-20" cy="653" r="18" fill="#FFD700"/>
    <circle cx="540" cy="653" r="18" fill="#FFD700"/>

    <!-- Parchment Scroll Body -->
    <rect x="0" y="20" width="520" height="620" rx="15" fill="url(#scrollPaper)" stroke="#D4AF37" stroke-width="5"/>
    <rect x="15" y="35" width="490" height="590" rx="10" fill="none" stroke="#8B0000" stroke-width="2" stroke-dasharray="8 4"/>

    <!-- Ganesha Emblem at Top -->
    <g transform="translate(260, 80)">
      <circle cx="0" cy="0" r="32" fill="#8B0000" stroke="#FFD700" stroke-width="3"/>
      <text x="0" y="10" text-anchor="middle" font-size="34">🐘</text>
    </g>

    <!-- Devnagari Lagan Scroll Text -->
    <text x="260" y="150" text-anchor="middle" font-family="'Rozha One', 'Yatra One', serif" font-size="26" fill="#8B0000" font-weight="bold">
      ॥ श्री गणेशाय नमः ॥
    </text>

    <!-- Main Title Banner -->
    <rect x="110" y="175" width="300" height="50" rx="12" fill="#8B0000" stroke="#FFD700" stroke-width="2"/>
    <text x="260" y="210" text-anchor="middle" font-family="'Rozha One', 'Yatra One', serif" font-size="28" fill="#FFD700" font-weight="extrabold">
      ॥ शुभ लग्न पत्रिका ॥
    </text>

    <!-- Groom & Bride Names Written Directly ON the Scroll -->
    <g font-family="'Rozha One', 'Yatra One', sans-serif" text-anchor="middle">
      <!-- Groom Name -->
      <text x="260" y="285" font-size="34" fill="#2D060C" font-weight="bold">
        चि. नवीन लुहाच
      </text>

      <text x="260" y="330" font-size="24" fill="#8B0000" font-weight="semibold">
        (सुपुत्र: श्रीमती सुनीता देवी एवं ऑनरेरी कैप्टन सत्यवीर सिंह)
      </text>

      <text x="260" y="375" font-size="28" fill="#D4AF37" font-weight="bold">
        ❤️ संग ❤️
      </text>

      <!-- Bride Name -->
      <text x="260" y="430" font-size="34" fill="#8B0000" font-weight="bold">
        कु. मनीषा शेओराण
      </text>
    </g>

    <!-- Date & Venue Details -->
    <line x1="80" y1="465" x2="440" y2="465" stroke="#8B0000" stroke-width="2" stroke-dasharray="6 3"/>

    <text x="260" y="505" text-anchor="middle" font-family="'Rozha One', 'Yatra One', serif" font-size="24" fill="#2D060C" font-weight="bold">
      पावन तिथि: 19 नवंबर 2026 (गुरुवार)
    </text>

    <text x="260" y="545" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" fill="#5D4037" font-weight="bold">
      स्थान: नंधा की ढाणी, बाढड़ा (चरखी दादरी)
    </text>

    <text x="260" y="585" text-anchor="middle" font-family="'Rozha One', serif" font-size="20" fill="#8B0000" font-weight="bold">
      #Navisha  •  शुभ विवाह
    </text>
  </g>
</svg>
