<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="ganeshaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="1"/>
      <stop offset="50%" stop-color="#FF8C00" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8B0000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldCircle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
  </defs>

  <!-- Background Aura -->
  <circle cx="250" cy="250" r="230" fill="url(#ganeshaGlow)"/>

  <!-- Golden Mandala Ring -->
  <circle cx="250" cy="250" r="210" fill="#2D060C" stroke="url(#goldCircle)" stroke-width="6"/>
  <circle cx="250" cy="250" r="195" fill="none" stroke="#FFD700" stroke-width="2" stroke-dasharray="8 4"/>

  <!-- Lord Ganesha Artistic Emblem -->
  <g transform="translate(250, 220)">
    <!-- Crown (Mukut) -->
    <path d="M -35,-75 L 0,-130 L 35,-75 L 20,-60 L -20,-60 Z" fill="#FFD700" stroke="#8B0000" stroke-width="2"/>
    <circle cx="0" cy="-100" r="8" fill="#8B0000"/>

    <!-- Ears -->
    <ellipse cx="-60" cy="-30" rx="35" ry="45" fill="#FF8C00" stroke="#FFD700" stroke-width="3"/>
    <ellipse cx="60" cy="-30" rx="35" ry="45" fill="#FF8C00" stroke="#FFD700" stroke-width="3"/>

    <!-- Head & Face -->
    <ellipse cx="0" cy="-25" rx="45" ry="50" fill="#FFA500" stroke="#FFD700" stroke-width="3"/>

    <!-- Tilak / Trishul Mark -->
    <path d="M -15,-50 L 0,-65 L 15,-50 L 5,-35 L -5,-35 Z" fill="#8B0000"/>
    <circle cx="0" cy="-45" r="5" fill="#FFD700"/>

    <!-- Trunk (Sond) -->
    <path d="M -15,0 C -25,30 -15,70 15,65 C 30,60 30,40 15,45 C 5,48 -5,35 0,0 Z" fill="#FF8C00" stroke="#FFD700" stroke-width="3"/>

    <!-- Modak in Trunk -->
    <circle cx="28" cy="52" r="10" fill="#FFD700" stroke="#8B0000" stroke-width="2"/>
  </g>

  <!-- Circular Text Path for ॥ श्री गणेशाय नमः ॥ -->
  <path id="textCircle" d="M 60,250 A 190,190 0 1,1 440,250" fill="none"/>

  <!-- Surrounding Devnagari Text -->
  <text font-family="'Rozha One', 'Yatra One', serif" font-size="22" font-weight="bold" fill="#FFD700">
    <textPath href="#textCircle" startOffset="50%" text-anchor="middle">
      🕉️  ॥ श्री गणेशाय नमः ॥  🕉️
    </textPath>
  </text>
</svg>
